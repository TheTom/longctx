[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longctx-svc"
version = "0.3.1"
description = "Local retrieval companion for inference servers — scoped, session-aware, file-watching."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "TheTom"}]
keywords = ["retrieval", "rag", "llm", "long-context", "service", "vllm", "llama-cpp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "longctx>=0.2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "pathspec>=0.12",
    "watchdog>=4.0",
    "httpx>=0.27",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.0",  # CrossEncoder ships in same package
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
longctx-svc = "longctx_svc.cli:main"

[project.urls]
Homepage = "https://github.com/TheTom/longctx"
Repository = "https://github.com/TheTom/longctx"
Documentation = "https://github.com/TheTom/longctx/blob/main/docs/PRD-v0.3.md"

[tool.setuptools.packages.find]
include = ["longctx_svc*"]
